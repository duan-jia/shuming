name: fast-llm-reasoner-staging
services:
  mysql:
    image: mirror.ccs.tencentyun.com/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ${REPO_ROOT}/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [staging]
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    user: "${HOST_UID}:${HOST_GID}"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["--config", "/run/fastllm/config.json", "--port", "9006", "--embedding-model", "/models/bge-small-zh-v1.5-q4_k_m.gguf", "--rag-dir", "/data/rag"]
    volumes:
      - ${STAGING_ROOT}/config.json:/run/fastllm/config.json:ro
      - ${STAGING_ROOT}/rag-data:/data/rag
    ports:
      - "127.0.0.1:9006:9006"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9006/api/health"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    networks: [staging]
  mcp:
    image: ${MCP_IMAGE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3100"
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,mcp
      RAG_API_BASE_URL: http://backend:9006
      RAG_TIMEOUT_MS: "30000"
      SERVICE_PRINCIPALS_JSON: >-
        [{"name":"staging-e2e","tokenSha256":"${MCP_BEARER_TOKEN_SHA256}","tenantId":1,"upstreamUsername":"mcp_staging","upstreamPassword":"${SERVICE_ACCOUNT_PASSWORD}"}]
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks: [staging]
volumes:
  mysql-data:
networks:
  staging:
    driver: bridge
