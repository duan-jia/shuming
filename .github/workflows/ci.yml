name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CPU build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql-test-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            default-libmysqlclient-dev \
            git \
            gfortran \
            libboost-all-dev \
            libopenblas-dev \
            libssl-dev \
            poppler-utils

      - name: Configure CPU Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DGGML_NATIVE=OFF

      - name: Build focused test
        run: cmake --build build --target knowledge-search-service-test mysql-pool-test native-mcp-test-server --parallel 2

      - name: Run focused backend tests
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PASSWORD: mysql-test-only
        run: |
          ./build/bin/knowledge-search-service-test
          ./build/bin/mysql-pool-test

      - name: Set up Node.js for MCP interoperability
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked MCP client SDK
        run: npm ci --prefix mcp-gateway --ignore-scripts --no-audit --no-fund

      - name: Verify native MCP over HTTP with official client SDK
        env:
          MCP_SDK_ROOT: ${{ github.workspace }}/mcp-gateway/node_modules/@modelcontextprotocol/client
        run: >-
          python3 tests/native_mcp_e2e.py
          --server-command build/bin/native-mcp-test-server
          --sdk-command 'node tests/native_mcp_sdk.mjs' -v

      - name: Verify agent loop streaming and control
        env:
          MCP_SDK_ROOT: ${{ github.workspace }}/mcp-gateway/node_modules/@modelcontextprotocol/client
        run: >-
          python3 tests/agent_runtime_e2e.py
          --server-command build/bin/native-mcp-test-server
          --sdk-command 'node tests/native_mcp_sdk.mjs' -v

      - name: Build backend server
        run: cmake --build build --target fast-llm-reasoner --parallel 2

      - name: Build backend CLI
        run: cmake --build build --target fast-llm-cli --parallel 2

  mcp-gateway:
    name: MCP gateway checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  deployment:
    name: Deployment isolation checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run deployment tests
        run: python3 -m unittest discover -s tests -p 'test_*deploy*.py'
      - name: Test staging guard
        run: python3 -m unittest discover -s tests -p test_staging_isolation.py
      - name: Test production release
        run: python3 -m unittest discover -s tests -p test_production_release.py
      - name: Check shell syntax
        run: bash -n deploy/staging/deploy.sh deploy/staging/pull-images.sh

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
