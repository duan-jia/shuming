name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CPU build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql-test-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        shell: bash
        run: |
          # Keep downloads off the Azure archive endpoint that was slow in CI.
          # Edit only this ephemeral runner; preserve suites, components and keys.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"
          done
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends \
            build-essential \
            cmake \
            default-libmysqlclient-dev \
            git \
            gfortran \
            libboost-dev \
            libopenblas-dev \
            libssl-dev \
            poppler-utils

      - name: Configure CPU Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DGGML_NATIVE=OFF

      - name: Build focused test
        run: cmake --build build --target knowledge-search-service-test mysql-pool-test native-mcp-test-server auth-security-test auth-service-test document-access-test rag-metadata-test --parallel 2

      - name: Run focused backend tests
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PASSWORD: mysql-test-only
        run: |
          ./build/bin/knowledge-search-service-test
          ./build/bin/mysql-pool-test
          ./build/bin/auth-security-test
          ./build/bin/auth-service-test
          ./build/bin/document-access-test
          ./build/bin/rag-metadata-test

      - name: Set up Node.js for MCP interoperability
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked MCP client SDK
        run: npm ci --prefix mcp-gateway --ignore-scripts --no-audit --no-fund

      - name: Verify native MCP over HTTP with official client SDK
        env:
          MCP_SDK_ROOT: ${{ github.workspace }}/mcp-gateway/node_modules/@modelcontextprotocol/client
        run: >-
          python3 tests/native_mcp_e2e.py
          --server-command build/bin/native-mcp-test-server
          --sdk-command 'node tests/native_mcp_sdk.mjs' -v

      - name: Verify agent loop streaming and control
        env:
          MCP_SDK_ROOT: ${{ github.workspace }}/mcp-gateway/node_modules/@modelcontextprotocol/client
        run: >-
          python3 tests/agent_runtime_e2e.py
          --server-command build/bin/native-mcp-test-server
          --sdk-command 'node tests/native_mcp_sdk.mjs' -v

      - name: Build backend server
        run: cmake --build build --target fast-llm-reasoner --parallel 2

      - name: Build backend CLI
        run: cmake --build build --target fast-llm-cli --parallel 2

  mcp-gateway:
    name: MCP gateway checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  deployment:
    name: Deployment isolation checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public repository safety policy
        run: node --test tests/public_repository_policy.test.mjs tests/image_artifact_privacy.test.mjs
      - name: Verify paper dataset and graders
        run: |
          node tests/datasets/recent-papers-v1/scripts/validate.mjs
          node --test tests/datasets/recent-papers-v1/tests/dataset.test.mjs
          node tests/reviews/probe_recent_papers_grader.mjs
      - name: Verify frozen paper dataset checksums
        working-directory: tests/datasets/recent-papers-v1
        run: sha256sum --check checksums.sha256
      - name: Verify evaluation adapters and model harness
        run: |
          python3 -m unittest discover -s tests -p 'test_evaluation.py'
          python3 -m unittest discover -s tests -p 'test_agent_model_eval.py'
      - name: Verify paper processing and title validation
        run: |
          python3 -m unittest discover -s tests -p 'test_paper_card.py'
          python3 -m unittest discover -s tests -p 'test_pdf_model_request.py'
      - name: Run deployment tests
        run: python3 -m unittest discover -s tests -p 'test_*deploy*.py'
      - name: Test staging guard
        run: python3 -m unittest discover -s tests -p test_staging_isolation.py
      - name: Test production release
        run: python3 -m unittest discover -s tests -p test_production_release.py
      - name: Check shell syntax
        run: bash -n deploy/staging/deploy.sh deploy/staging/pull-images.sh

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --experimental-transform-types --test tests/session-title.spec.ts tests/sse.spec.ts tests/library-access.spec.ts tests/paper-upload-naming.spec.ts
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
