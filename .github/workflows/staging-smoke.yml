name: Staging runner smoke

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/staging-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Tencent staging runner smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, staging]
    timeout-minutes: 10

    steps:
      - name: Show runner and host resources
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          echo "Architecture: ${RUNNER_ARCH}"
          uname -a
          nproc
          free -h
          df -h /

      - name: Verify Docker and Compose
        shell: bash
        run: |
          set -euo pipefail
          test -S /var/run/docker.sock
          docker version
          docker compose version
          docker info --format 'Server version={{.ServerVersion}}; CPUs={{.NCPU}}; memory={{.MemTotal}}'

      - name: Run container without an external registry
        shell: bash
        run: |
          set -euo pipefail
          image='staging-smoke:local'
          rootfs="$(mktemp -d)"
          cleanup() {
            docker image rm --force "$image" >/dev/null 2>&1 || true
            rm -rf "$rootfs"
          }
          trap cleanup EXIT

          install -D /bin/echo "$rootfs/bin/echo"
          while read -r library; do
            install -D "$library" "$rootfs$library"
          done < <(
            ldd /bin/echo |
              awk '{ for (i = 1; i <= NF; i++) if ($i ~ /^\//) { print $i; break } }'
          )

          tar -C "$rootfs" -cf - . | docker import - "$image"
          docker run --rm "$image" /bin/echo 'staging container runtime is healthy'

      - name: Probe Docker Hub connectivity
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --output /dev/null \
            --write-out 'Docker Hub HTTP status: %{http_code}\n' \
            https://registry-1.docker.io/v2/
