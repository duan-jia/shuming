name: Staging E2E

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/staging-e2e.yml
      - .dockerignore
      - deploy/staging/**
      - CMakeLists.txt
      - engine/**
      - mcp-gateway/**
      - sql/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-test:
    name: Deploy and test staging MCP
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    environment: staging
    runs-on: [self-hosted, Linux, X64, staging]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Download and verify embedding model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/embedding
          target='.artifacts/embedding/bge-small-zh-v1.5-q4_k_m.gguf'
          expected='0c17cc6ed7ec697db6768c2db6dd22c4e816a12c68ed14ff4d764927338532f8'
          urls=(
            'https://huggingface.co/CompendiumLabs/bge-small-zh-v1.5-gguf/resolve/5bf683e6a1bd454bbb60ba051088c50731d63fcb/bge-small-zh-v1.5-q4_k_m.gguf?download=true'
            'https://hf-mirror.com/CompendiumLabs/bge-small-zh-v1.5-gguf/resolve/5bf683e6a1bd454bbb60ba051088c50731d63fcb/bge-small-zh-v1.5-q4_k_m.gguf'
          )

          downloaded=false
          for url in "${urls[@]}"; do
            if curl --fail --location --retry 2 \
              --connect-timeout 10 --max-time 180 \
              --output "$target.tmp" "$url"; then
              actual="$(sha256sum "$target.tmp" | awk '{print $1}')"
              if [[ "$actual" == "$expected" ]]; then
                mv "$target.tmp" "$target"
                downloaded=true
                break
              fi
              echo "Downloaded model checksum mismatch" >&2
            fi
          done
          [[ "$downloaded" == true ]] || { echo 'Unable to fetch the verified embedding model' >&2; exit 1; }
          printf '%s  %s\n' "$expected" "$target" | sha256sum --check

      - name: Deploy stack and run E2E
        env:
          EMBEDDING_MODEL_SOURCE: ${{ github.workspace }}/.artifacts/embedding/bge-small-zh-v1.5-q4_k_m.gguf
          STAGING_ROOT: /opt/fast-llm-reasoner/staging
        run: ./deploy/staging/deploy.sh

      - name: Show service status after failure
        if: failure()
        env:
          STAGING_ROOT: /opt/fast-llm-reasoner/staging
        shell: bash
        run: |
          set +e
          if [[ -f "$STAGING_ROOT/.env" ]]; then
            export REPO_ROOT="$GITHUB_WORKSPACE"
            docker compose \
              --env-file "$STAGING_ROOT/.env" \
              --file deploy/staging/compose.yml \
              ps
          fi
